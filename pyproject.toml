[project]
name = "progetto-gearbox"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy (==2.2.4)",
    "matplotlib (==3.10.1)",
    "scipy (==1.15.2)",
    "bokeh (>=3.9.0,<4.0.0)"
]

[tool.poetry]
packages = [{include = "progetto_gearbox", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "ruff (>=0.15.0,<0.16.0)"
]
